name: Update dataset daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: |
          python --version
          which python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests openpyxl
          python -m pip install warframe-market.py
          python -m pip show warframe-market.py || true
          python -m pip list

      - name: Verify warframe_market import
        run: |
          python -c "from warframe_market.client import WarframeMarketClient; print('warframe_market import OK')"

      - name: Run dataset builder
        run: |
          python build_dataset.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update dataset"
          git push